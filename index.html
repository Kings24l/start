<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingspage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --light-blue: #69c8f7;
      --blue: #2a5bfe;
      --dark-blue: #0102d0;
      --black: #000000;
      --white: #fafaff;
    }

            .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark-blue);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(98, 74, 255, 0.1);
            color: var(--blue);
        }

            body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--light-blue);
            color: var(--proton-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topMenu {
            background-color: white;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .wrap {
            margin: 0 auto;
            padding: 0 20px;
            max-width: 1200px;
        }

        #topMenu .wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
  </style>
</head>
<body>
  <nav id="topMenu">
    <div class="wrap">
      <div class="nav-links">
        <a href="index.html" class="active">start</a>
        <a href="test.html">test</a>
        <a href="chat.html">chat</a>
        <a href="info.html">info</a>
        <a href="faq.html">FAQ</a>
      </div>
    </div>
  </nav>
</body>
